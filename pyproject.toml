[project]
name = "loomgit"
version = "0.1.5"
description = "AI-powered context engine that weaves developer memory and codebase history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "groq>=0.4.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
[project.scripts]
loomgit = "loomgit.cli:main"
