[project]
name = "devmemory"
version = "0.1.0"
description = "A tool that remembers developers knowledge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "groq>=0.4.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "google-genai>=1.0.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
[project.scripts]
devmemory = "devmemory.cli:main"
